<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LaTeX</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><img class="brand-icon" src="icon.svg" alt=""><h1>LaTeX</h1></header>
<main>
<h2 class="section-title">Quick Settings</h2>
<section class="controls" aria-label="Quick Settings">
<label class="control-row" for="enabled"><span>Shortcuts</span><input id="enabled" class="switch" type="checkbox" role="switch" disabled></label>
<label class="control-row" for="paper-enabled"><span>Dropbox Paper</span><input id="paper-enabled" class="switch" type="checkbox" role="switch" disabled></label>
</section>
<section class="notice" id="state-card" aria-live="polite" hidden>
<div class="notice-heading"><span class="notice-dot" aria-hidden="true"></span><h3 id="status"></h3></div>
<p id="status-detail"></p>
<button id="permission" type="button" hidden>Allow Dropbox access</button>
<button id="connect" type="button" hidden>Reconnect this tab</button>
</section>
<a class="catalog-link" href="shortcuts.html" target="_blank"><span>Keyboard shortcuts</span><span aria-hidden="true">↗</span></a>
<details class="help"><summary>Troubleshooting <span aria-hidden="true">+</span></summary>
<div class="help-content"><p>Open an equation with <code>$$</code>, then type a shortcut. Use Tab and Shift+Tab to move between fields.</p>
<button id="inspect" type="button">Inspect editor</button><textarea id="result" aria-label="Diagnostic report" readonly rows="7"></textarea><button id="select" type="button">Select report</button></div>
</details>
</main>
<script src="popup.js"></script>
</body></html>
